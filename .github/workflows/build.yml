name: Build All

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Download NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip -d $HOME/ndk

      - name: Build daemon
        run: |
          NDK_BIN="$HOME/ndk/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$NDK_BIN/clang++" --target=aarch64-linux-android33 -std=c++17 -O2 -fPIE -pie -static-libstdc++ \
              daemon/main.cpp -o ffd

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          cat local.properties
          ls -la $ANDROID_HOME || ls -la /usr/local/lib/android/sdk || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload daemon
        uses: actions/upload-artifact@v4
        with:
          name: ffd-daemon
          path: ffd

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FFHack-APK
          path: app/build/outputs/apk/debug/app-debug.apk
