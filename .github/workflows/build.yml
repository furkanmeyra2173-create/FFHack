name: Build All

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── JAVA ──
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── ANDROID SDK ──
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package no longer exists in the Android SDK.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # ── NDK ──
      - name: Download NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip -d $HOME/ndk

      # ── DAEMON BUILD ──
      - name: Build daemon
        run: |
          NDK_BIN="$HOME/ndk/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$NDK_BIN/clang++" --target=aarch64-linux-android33 -std=c++17 -O2 -fPIE -pie -static-libstdc++ \
              daemon/main.cpp -o ffd

      # ── GRADLE WRAPPER ──
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── APK BUILD ──
      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # ── ARTIFACTS ──
      - name: Upload daemon
        uses: actions/upload-artifact@v4
        with:
          name: ffd-daemon
          path: ffd

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FFHack-APK
          path: app/build/outputs/apk/debug/app-debug.apk
